server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security Headers ───────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Image Caching (1 year, immutable) ──────────
    location /images/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── App icons (30 days — safe to refresh occasionally) ──
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ── Web app manifest ────────────────────────────
    location = /manifest.json {
        types { application/manifest+json json; }
        default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Service worker: never cache — the browser must always
    #    revalidate so shell/asset updates are picked up promptly ──
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }

    # ── SPA fallback ───────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block dotfiles ─────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
